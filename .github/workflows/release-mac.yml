# Builds the Mac app and attaches it to a GitHub Release, so coworkers can download it from
# the repo's Releases page and run it with no network.
#
# To publish a new version: bump "version" in src-tauri/tauri.conf.json, then
#   git tag v0.1.0 && git push origin v0.1.0
# Or run it by hand from the Actions tab (it uses the version in tauri.conf.json).
#
# The build is universal (Apple Silicon + Intel) and ad-hoc signed, not notarized — the
# first launch needs "Open Anyway" in System Settings → Privacy & Security.
#
# The starter scans and prints in public/seed/ are gitignored, so they are never in this build: the
# downloaded app opens with an empty gallery, and the BM38–49 stations load their sheets and
# pedestals without the museum's prints or scans — the same rule as the Pair Viewer (2026-10-06).
name: Release Mac app

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Reflection Viewer v__VERSION__
          releaseBody: |
            **Reflection Viewer for Mac** — works fully offline once downloaded. Runs on Apple Silicon and Intel Macs (macOS 11+).

            1. Download the `.dmg` below and open it.
            2. Drag **Reflection Viewer** into Applications.
            3. The first time, macOS will block it because it isn't from the App Store. Open **System Settings → Privacy & Security**, scroll down, click **Open Anyway** next to Reflection Viewer, and confirm. After that it opens normally.

            The gallery starts empty. Drag scans and prints onto the window, or use **Gallery → Import** with a gallery `.zip` — saved setups come with it.
          releaseDraft: false
          prerelease: false
          # package.json has no "tauri" script, so call the CLI directly.
          tauriScript: npx tauri
          args: --target universal-apple-darwin
